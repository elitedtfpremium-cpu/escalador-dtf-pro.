
name: Crear APK - Escalador DTF Pro

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK existente
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"

      - name: Descomprimir proyecto
        run: |
          unzip -o Escalador_DTF_Pro_GitHub_APK.zip -d /tmp/dtf
          cp -a /tmp/dtf/Escalador_DTF_Pro_Android/. .

      - name: Instalar dependencias
        run: npm install

      - name: Crear Android
        run: npx cap add android

      - name: Sincronizar aplicación
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Escalador-DTF-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
